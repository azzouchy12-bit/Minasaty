<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="إنشاء حساب جديد في أكاديمية التفوق للفيزياء والرياضيات.">
  <title>تسجيل حساب جديد | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css?v=register-fixed-layout-1">
  <link rel="stylesheet" href="./css/app.css?v=register-fixed-layout-1">
</head>
<body class="app-shell register-page">
  <main class="auth-layout">
    <section class="auth-card wide-card">
      <a class="brand-link" href="./index.html">أكاديمية التفوق</a>
      <p class="eyebrow">انضم إلى الأكاديمية</p>
      <h1>تسجيل حساب جديد</h1>
      <p class="register-intro">أكمل معلوماتك ثم أنشئ حسابك مباشرةً.</p>

      <form id="register-form" class="stack-form" novalidate>
        <label for="student-name">
          <span>الاسم واللقب <small class="field-hint">(الاسم الصحيح)</small></span>
          <input id="student-name" name="studentName" type="text" autocomplete="name" required maxlength="120">
        </label>

        <label for="parent-email">
          <span>البريد الإلكتروني <small class="field-hint">(اختياري)</small></span>
          <input id="parent-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="example@email.com">
        </label>

        <label for="parent-phone">
          <span>أدخل رقم الهاتف شغال</span>
          <input id="parent-phone" name="parentPhone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="0556960950" maxlength="10" required>
          <small class="field-hint">يجب أن يتكون من 10 أرقام ويبدأ بـ 05 أو 06 أو 07.</small>
        </label>

        <div class="pin-fields" aria-label="كلمة المرور">
          <label for="parent-pin">
            <span>كلمة المرور <small class="field-hint">(4 أرقام)</small></span>
            <input id="parent-pin" name="parentPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4}" minlength="4" maxlength="4" placeholder="••••" required>
          </label>

          <label for="confirm-parent-pin">
            <span>أعد كتابة كلمة المرور</span>
            <input id="confirm-parent-pin" name="confirmParentPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{4}" minlength="4" maxlength="4" placeholder="••••" required>
          </label>
        </div>

        <section id="registration-details" class="registration-details" aria-labelledby="registration-details-title">
          <div class="verification-heading">
            <span class="verification-step">1</span>
            <div>
              <h2 id="registration-details-title">بيانات الدراسة</h2>
              <p>اختر المستوى الدراسي لإكمال إنشاء الحساب.</p>
            </div>
          </div>

          <label for="student-level">المستوى الدراسي</label>
          <select id="student-level" name="level" required>
            <option value="" selected disabled>اختر المستوى الدراسي</option>
            <option value="السنة الأولى">السنة الأولى متوسط</option>
            <option value="السنة الثانية">السنة الثانية متوسط</option>
            <option value="السنة الثالثة">السنة الثالثة متوسط</option>
            <option value="السنة الرابعة">السنة الرابعة متوسط</option>
            <option value="طالب جامعي">طالب جامعي</option>
          </select>


          <div id="university-card-field" class="university-card-field" hidden>
            <label for="card-photo">صورة بطاقة الطالب الجامعي</label>
            <input id="card-photo" name="cardPhoto" type="file" accept="image/png,image/jpeg" capture="environment" disabled>
            <small>الصيغ المسموحة: JPG أو PNG — الحجم الأقصى 5 ميغابايت.</small>
          </div>
        </section>

        <p id="register-message" class="form-message" hidden aria-live="polite"></p>
        <button id="submit-btn" class="cta-button cta-primary" type="submit">إتمام التسجيل</button>
      </form>
    </section>
  </main>

  <section id="registration-confirmation" class="modal" role="dialog" aria-modal="true" aria-labelledby="registration-confirmation-title" hidden>
    <div class="modal-card" role="document">
      <p class="eyebrow">تم بنجاح</p>
      <h2 id="registration-confirmation-title">تم تأكيد التسجيل</h2>
      <p id="registration-confirmation-text" class="muted" aria-live="polite"></p>
      <div class="confirmation-actions">
        <button id="register-another-btn" class="cta-button cta-secondary" type="button">تسجيل تلميذ آخر</button>
        <button id="go-to-dashboard-btn" class="cta-button cta-primary" type="button">الدخول إلى حسابي</button>
      </div>
    </div>
  </section>

  <script src="./js/referral-attribution.js?v=referral-register-1"></script>
  <script defer src="./js/register.js?v=register-fixed-layout-1"></script>
  <script src="./js/in-app-browser-gate.js?v=telegram-gate-2" defer></script>
</body>
</html>
