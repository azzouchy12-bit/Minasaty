<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول الأستاذ | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="app-shell">
    <main class="auth-layout">
    <section class="auth-card" style="text-align: center;">
      <a class="brand-link" href="./index.html" style="display: block; text-align: center;">أكاديمية التفوق</a>
      <p class="eyebrow" style="text-align: center;">بوابة الأستاذ</p>
      <form id="teacher-login-form" class="stack-form">
        <label for="teacher-passcode" style="text-align: right; display: block;">رمز دخول الأستاذ</label>
        <input id="teacher-passcode" type="password" autocomplete="current-password" required />
        <p id="login-error" class="form-error" hidden aria-live="polite"></p>
        <button class="cta-button cta-teacher" type="submit" style="width: 100%; min-height: 4.5rem; font-size: 1.25rem; font-weight: 900; background: #0284c7; border-color: #0284c7; border-radius: 1rem; cursor: pointer;">دخول</button>
      </form>
    </section>
  </main>
  <script src="./js/session-storage.js?v=single-session-1"></script>
  <script src="./js/auth-session-redirect.js?v=session-redirect-1" defer></script>
  <script src="./js/teacher-login.js"></script>
  <script src="./js/in-app-browser-gate.js?v=telegram-gate-2" defer></script>
</body>
</html>
