<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الرسائل | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/private-messages.css?v=messenger-ui-2" />
</head>
<body class="private-messages-page teacher-chat-page">
  <header class="private-chat-topbar">
    <a class="private-chat-brand" href="./teacher-dashboard.html">أكاديمية التفوق <small>رسائل الأستاذ</small></a>
    <div class="private-chat-topbar-actions">
      <a class="message-bell" data-message-bell href="./teacher-chat.html" aria-label="الرسائل">
        <span aria-hidden="true">✉</span><b data-message-badge hidden>0</b>
      </a>
      <a class="private-chat-back" href="./teacher-dashboard.html">العودة إلى لوحة الأستاذ</a>
    </div>
  </header>
  <main class="private-chat-layout messenger-layout">
    <aside class="conversation-sidebar" aria-label="قائمة محادثات التلاميذ">
      <div class="conversation-sidebar-head">
        <div><strong>الدردشات</strong><small id="conversation-count">0 تلميذ</small></div>
        <button class="conversation-new-button" type="button" aria-label="بدء محادثة جديدة">✎</button>
      </div>
      <label class="conversation-search" for="conversation-search">
        <span aria-hidden="true">⌕</span>
        <input id="conversation-search" type="search" placeholder="ابحث عن تلميذ…" autocomplete="off" />
      </label>
      <div id="conversation-list" class="conversation-list"></div>
      <p id="conversation-empty" class="conversation-empty">لا توجد تلاميذ مطابقون للبحث.</p>
    </aside>
    <section class="conversation-main" aria-label="المحادثة">
      <div id="chat-empty-state" class="chat-empty-state"><span class="messenger-empty-icon">✦</span><h1>رسائلك مع التلاميذ</h1><p>اختر تلميذًا من القائمة، ثم أرسل له رسالة مباشرة.</p></div>
      <div id="chat-panel" class="chat-panel" hidden>
        <header class="chat-panel-head">
          <div class="chat-contact-copy"><span id="chat-student-avatar" class="chat-contact-avatar">ت</span><span><strong id="chat-student-name">الطالب</strong><small id="chat-student-level"></small></span></div>
          <div class="chat-panel-tools"><span class="chat-online-dot" aria-hidden="true"></span><span>محادثة خاصة</span></div>
        </header>
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-compose">
          <div id="chat-attachment-preview" class="chat-attachment-preview" hidden></div>
          <div class="chat-compose-row">
            <button id="chat-attach-btn" class="chat-compose-tool" type="button" aria-label="إرفاق ملف" aria-haspopup="menu" aria-expanded="false" aria-controls="chat-attach-menu">＋</button>
            <div id="chat-attach-menu" class="chat-attach-menu" hidden role="menu">
              <button type="button" role="menuitem" data-attach="camera">التقاط صورة</button>
              <button type="button" role="menuitem" data-attach="file">اختيار ملف</button>
            </div>
            <textarea id="chat-input" rows="1" maxlength="4000" placeholder="اكتب رسالة للطالب…" autocomplete="off"></textarea>
            <button class="chat-send-button" type="submit" aria-label="إرسال الرسالة">إرسال</button>
          </div>
          <input id="chat-camera-input" class="chat-attach-input" type="file" accept="image/*" capture="environment" hidden>
          <input id="chat-file-input" class="chat-attach-input" type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
        </form>
      </div>
    </section>
  </main>
  <div id="chat-error" class="chat-inline-error" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/session-storage.js?v=single-session-1"></script>
  <script src="./js/message-notifications.js"></script>
  <script src="./js/chat-attachments.js?v=messenger-ui-2"></script>
  <script src="./js/teacher-chat.js?v=messenger-ui-2"></script>
  <script src="./js/in-app-browser-gate.js?v=telegram-gate-2" defer></script>
</body>
</html>
