<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>الحصص المباشرة | أكاديمية التفوق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/live-classes-entry.css?v=live-entry-1" />
  </head>
  <body class="live-classes-page">
    <div class="live-classes-shell">
      <header class="live-classes-header">
        <div class="live-classes-brand">
          <strong>أكاديمية التفوق</strong>
          <span id="live-classes-student-context">الحصص المباشرة</span>
        </div>
        <button id="live-classes-exit" class="live-classes-exit" type="button">خروج</button>
      </header>
      <main class="live-classes-stage" aria-label="انتظار الحصة المباشرة">
        <section class="live-classes-frame" aria-labelledby="live-classes-frame-title">
          <div class="live-classes-frame-copy">
            <span class="live-classes-frame-kicker">موعد الحصة القادمة</span>
            <strong id="live-classes-frame-time" class="live-classes-frame-time">جارٍ تحميل توقيت الحصة…</strong>
            <span id="live-classes-frame-subject" class="live-classes-frame-subject">—</span>
            <p id="live-classes-frame-note" class="live-classes-frame-note">هذه صفحة انتظار فقط. سيظهر بث الأستاذ عند فتح الحصة المباشرة.</p>
          </div>
        </section>
      </main>
    </div>
    <script src="./js/live-classes.js?v=live-entry-1"></script>
  </body>
</html>
