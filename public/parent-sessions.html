<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سجل الحصص والدروس المسجلة | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" /><link rel="stylesheet" href="./css/parent-dashboard-refactor.css" /><link rel="stylesheet" href="./css/parent-screen-common.css" />
</head>
<body class="parent-screen">
  <header class="parent-screen-header"><h1>سجل الحصص والدروس المسجلة</h1><a class="parent-screen-back" href="parent-dashboard.html">← العودة إلى الرئيسية</a></header>
  <main class="parent-screen-main"><div class="parent-screen-student"><span class="parent-screen-avatar" id="parent-screen-student-avatar">ت</span><span class="parent-screen-student-copy"><strong id="parent-screen-student-name">التلميذ الحالي</strong><small id="parent-screen-student-level"></small></span></div><p id="parent-screen-error" class="parent-screen-error" hidden></p><section class="parent-screen-card"><h2>تصفية السجل</h2><p>اختر الفصل الدراسي ثم الشهر ثم المادة لعرض الحصص المسجلة.</p><div class="parent-screen-filters"><select id="session-term" aria-label="الفصل الدراسي"><option value="">اختر الفصل الدراسي</option><option value="TERM_1">الفصل الأول</option><option value="TERM_2">الفصل الثاني</option><option value="TERM_3">الفصل الثالث</option></select><select id="session-month" aria-label="الشهر" disabled><option value="">اختر الشهر</option></select><select id="session-subject" aria-label="المادة" disabled><option value="">اختر المادة</option></select></div><div id="sessions-list" class="parent-screen-list"><p class="parent-screen-empty">اختر الخيارات لعرض السجل.</p></div></section></main>
  <script src="./js/parent-screen-common.js"></script>
  <script>
    (() => { const student = window.parentScreen?.student; const term = document.getElementById("session-term"); const month = document.getElementById("session-month"); const subject = document.getElementById("session-subject"); const box = document.getElementById("sessions-list"); const months = { TERM_1: [["2026-09","سبتمبر 2026"],["2026-10","أكتوبر 2026"],["2026-11","نوفمبر 2026"]], TERM_2: [["2027-01","جانفي 2027"],["2027-02","فيفري 2027"]], TERM_3: [["2027-04","أبريل 2027"],["2027-05","ماي 2027"]] }; function options(select, placeholder, values, disabled) { select.replaceChildren(new Option(placeholder, "")); values.forEach(([value,label]) => select.append(new Option(label,value))); select.disabled = disabled; } function redraw() { options(month, term.value ? "اختر الشهر" : "اختر الفصل أولًا", months[term.value] || [], !term.value); options(subject, month.value ? "اختر المادة" : "اختر الشهر أولًا", student?.level === "طالب جامعي" ? [["PAID","اشتراك مدفوع"],["FREE","اشتراك مجاني"]] : [["MATH","الرياضيات"],["PHYSICS","الفيزياء"]], !month.value); } async function load() { if (!student?.id || !student?.level || !term.value || !month.value || !subject.value) { box.innerHTML = '<p class="parent-screen-empty">اختر الفصل والشهر والمادة أولًا.</p>'; return; } box.innerHTML = '<p class="parent-screen-empty">جارٍ تحميل السجل…</p>'; try { const payload = await parentScreen.api(`/api/schedules/registry/${encodeURIComponent(student.level)}?month=${encodeURIComponent(month.value)}&subject=${encodeURIComponent(subject.value)}&studentId=${encodeURIComponent(student.id)}`); const items = Array.isArray(payload.data) ? payload.data : []; box.replaceChildren(); if (!items.length) { box.innerHTML = '<p class="parent-screen-empty">لا توجد حصص في الاختيار الحالي.</p>'; return; } items.forEach((item) => { const card = document.createElement("article"); card.className = "parent-screen-item"; const title = document.createElement("strong"); title.textContent = item.subject === "PHYSICS" ? "الفيزياء" : item.subject === "MATH" ? "الرياضيات" : item.subject || "حصة دراسية"; const meta = document.createElement("span"); meta.textContent = `${item.scheduledAt ? new Intl.DateTimeFormat("ar-DZ", { dateStyle: "medium", timeStyle: "short" }).format(new Date(item.scheduledAt)) : "موعد غير محدد"} · ${item.status === "COMPLETED" ? "تمت الحصة" : item.status === "TEACHER_ABSENT" ? "غياب الأستاذ" : "في الانتظار"}`; card.append(title, meta); if (item.canWatch && (item.youtubeEmbedUrl || item.previewUrl)) { const link = document.createElement("a"); link.className = "parent-screen-button"; link.href = item.youtubeEmbedUrl || item.previewUrl; link.target = "_blank"; link.rel = "noopener"; link.textContent = "مشاهدة التسجيل"; card.append(link); } box.append(card); }); } catch (error) { box.innerHTML = `<p class="parent-screen-empty">${error.message}</p>`; } } term.addEventListener("change", () => { redraw(); load(); }); month.addEventListener("change", () => { redraw(); load(); }); subject.addEventListener("change", load); redraw(); })();
  </script>
</body>
</html>
