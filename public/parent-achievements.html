<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنجازات التلميذ وشهاداته | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" /><link rel="stylesheet" href="./css/parent-dashboard-refactor.css" /><link rel="stylesheet" href="./css/parent-screen-common.css" />
</head>
<body class="parent-screen">
  <header class="parent-screen-header"><h1>إنجازات التلميذ وشهاداته</h1><a class="parent-screen-back" href="parent-dashboard.html">← العودة إلى الرئيسية</a></header>
  <main class="parent-screen-main"><div class="parent-screen-student"><span class="parent-screen-avatar" id="parent-screen-student-avatar">ت</span><span class="parent-screen-student-copy"><strong id="parent-screen-student-name">التلميذ الحالي</strong><small id="parent-screen-student-level"></small></span></div><p id="parent-screen-error" class="parent-screen-error" hidden></p><section class="parent-screen-card"><h2>الشهادات والإنجازات</h2><p>تابع الشهادات التي حصل عليها التلميذ والإنجازات المسجلة في الأكاديمية.</p><div id="achievements-list" class="parent-screen-list"><p class="parent-screen-empty">جارٍ تحميل الإنجازات…</p></div></section></main>
  <script src="./js/parent-screen-common.js"></script>
  <script>
    (async () => { const box = document.getElementById("achievements-list"); const student = window.parentScreen?.student; if (student?.studentName) document.getElementById("parent-screen-student-avatar").textContent = student.studentName.slice(0, 1); if (!student?.id) { box.innerHTML = '<p class="parent-screen-empty">اختر تلميذًا من لوحة الولي أولًا.</p>'; return; } try { const payload = await parentScreen.api(`/api/certificates/student/${encodeURIComponent(student.id)}`); const items = Array.isArray(payload.data) ? payload.data : []; box.replaceChildren(); if (!items.length) { box.innerHTML = '<p class="parent-screen-empty">لا توجد شهادات أو إنجازات مسجلة حاليًا.</p>'; return; } items.forEach((item) => { const card = document.createElement("article"); card.className = "parent-screen-item"; const title = document.createElement("strong"); title.textContent = item.title || "شهادة إنجاز"; const date = document.createElement("span"); date.textContent = item.awardedAt ? `تاريخ الحصول عليها: ${new Intl.DateTimeFormat("ar-DZ", { dateStyle: "medium" }).format(new Date(item.awardedAt))}` : "إنجاز مسجل في الأكاديمية"; card.append(title, date); if (item.description) { const desc = document.createElement("span"); desc.textContent = item.description; card.append(desc); } box.append(card); }); } catch (error) { box.innerHTML = `<p class="parent-screen-empty">${error.message}</p>`; } })();
  </script>
</body>
</html>
