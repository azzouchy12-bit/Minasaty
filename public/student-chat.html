<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مراسلتي مع الأستاذ | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/private-messages.css?v=messenger-ui-2" />
</head>
<body class="private-messages-page student-chat-page">
  <header class="private-chat-topbar">
    <a class="private-chat-brand" href="./parent-dashboard.html">أكاديمية التفوق <small>مراسلتي مع الأستاذ</small></a>
    <div class="private-chat-topbar-actions">
      <a class="message-bell" data-message-bell href="./student-chat.html" aria-label="الرسائل"><span aria-hidden="true">✉</span><b data-message-badge hidden>0</b></a>
      <a class="private-chat-back" href="./parent-dashboard.html">العودة إلى حسابي</a>
    </div>
  </header>
  <main class="student-chat-shell messenger-layout">
    <section class="chat-panel student-chat-panel">
      <header class="chat-panel-head">
        <div class="chat-contact-copy"><span id="student-chat-avatar" class="chat-contact-avatar">ت</span><span><strong id="student-chat-name">محادثتي مع الأستاذ</strong><small id="student-chat-level"></small></span></div>
        <div class="chat-panel-tools"><span class="chat-online-dot" aria-hidden="true"></span><span>الأستاذ</span></div>
      </header>
      <div id="student-chat-messages" class="chat-messages" aria-live="polite"></div>
      <form id="student-chat-form" class="chat-compose">
        <div id="student-chat-attachment-preview" class="chat-attachment-preview" hidden></div>
        <div class="chat-compose-row">
          <button id="student-chat-attach-btn" class="chat-compose-tool" type="button" aria-label="إرفاق ملف" aria-haspopup="menu" aria-expanded="false" aria-controls="student-chat-attach-menu">＋</button>
          <div id="student-chat-attach-menu" class="chat-attach-menu" hidden role="menu">
            <button type="button" role="menuitem" data-attach="camera">التقاط صورة</button>
            <button type="button" role="menuitem" data-attach="file">اختيار ملف</button>
          </div>
          <textarea id="student-chat-input" rows="1" maxlength="4000" placeholder="اكتب رسالتك للأستاذ…" autocomplete="off"></textarea>
          <button class="chat-send-button" type="submit" aria-label="إرسال الرسالة">إرسال</button>
        </div>
        <input id="student-chat-camera-input" class="chat-attach-input" type="file" accept="image/*" capture="environment" hidden>
        <input id="student-chat-file-input" class="chat-attach-input" type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      </form>
    </section>
  </main>
  <div id="student-chat-error" class="chat-inline-error" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/session-storage.js?v=single-session-1"></script>
  <script src="./js/message-notifications.js"></script>
  <script src="./js/chat-attachments.js?v=messenger-ui-2"></script>
  <script src="./js/student-chat.js?v=messenger-ui-2"></script>
  <script src="./js/in-app-browser-gate.js?v=telegram-gate-2" defer></script>
</body>
</html>
